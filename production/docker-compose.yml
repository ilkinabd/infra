version: '3.8'

services:
  # --- MAIN REVERSE PROXY ---
  nginx:
    image: nginx:alpine
    container_name: lobbym-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/certs:ro
      - /var/www/dev.api.lobbym.com:/var/www/dev.api.lobbym.com:ro
      - /var/www/dev.admin.lobbym.com:/var/www/dev.admin.lobbym.com:ro
      - /var/www/dev.report.lobbym.com:/var/www/dev.report.lobbym.com:ro
    networks:
      lobbym-network:
        aliases:
          - lobbym.com
          - api.lobbym.com
          - admin.lobbym.com
          - report.lobbym.com
          - socket.lobbym.com
    depends_on:
      - lobbym-front
      - lobbym-api-php
      - lobbym-admin-php
      - lobbym-report-php

  # --- DATABASES & QUEUES ---
  db:
    image: postgres:17-alpine
    container_name: lobbym-postgres
    restart: always
    environment:
      - POSTGRES_DB=lobbym
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - lobbym-network

  redis:
    image: redis:7-alpine
    container_name: lobbym-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - lobbym-network

  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: lobbym-elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - lobbym-network

  kibana:
    image: kibana:8.11.1
    container_name: lobbym-kibana
    restart: always
    environment:
      - ELASTICSEARCH_HOSTS=http://lobbym-elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - lobbym-network

  cassandra:
    image: cassandra:5.0
    container_name: lobbym-cassandra
    mem_limit: 1536m
    restart: always
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - lobbym-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lobbym-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - lobbym-network

  # --- MICROSERVICES ---
  lobbym-scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: lobbym-scraper
    restart: always
    ports:
      - "8085:8085"
    networks:
      - lobbym-network
    environment:
      - SCRAPER_PROXY=gkxoynov-tr-rotate:zb2lsvs6o9uv@p.webshare.io:80
      - PYTHONUNBUFFERED=1

  lobbym-socket:
    build:
      context: ./socket
      dockerfile: Dockerfile
    container_name: lobbym-socket
    restart: always
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@lobbym-postgres:5432/lobbym
      - JWT_SECRET=CYtHI1pjd47GsOU5eKkklRmNdnePdyx89J40VEmGqjCkJlYC1fEazWyd5HSbOmoW
      - PORT=3000
    depends_on:
      - db
    networks:
      - lobbym-network

  # --- APPLICATIONS ---
  lobbym-front:
    build:
      context: /var/www/dev.lobbym.com
      dockerfile: deployments/Dockerfile
    container_name: lobbym-front
    restart: always
    working_dir: /app
    volumes:
      - /var/www/dev.lobbym.com:/app
      - ./enviroment/front.env:/app/.env
    environment:
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NODE_TLS_REJECT_UNAUTHORIZED=0
    networks:
      - lobbym-network
    command: start

  lobbym-api-php:
    build:
      context: /var/www/dev.api.lobbym.com
      dockerfile: deployments/Dockerfile
    container_name: lobbym-api-php
    restart: always
    working_dir: /var/www/dev.api.lobbym.com
    volumes:
      - /var/www/dev.api.lobbym.com:/var/www/dev.api.lobbym.com
      - ./enviroment/api.env:/var/www/dev.api.lobbym.com/.env
    environment:
      - HOME=/tmp
    networks:
      - lobbym-network

  lobbym-admin-php:
    build:
      context: /var/www/dev.admin.lobbym.com
      dockerfile: deployments/Dockerfile
    container_name: lobbym-admin-php
    restart: always
    working_dir: /var/www/dev.admin.lobbym.com
    volumes:
      - /var/www/dev.admin.lobbym.com:/var/www/dev.admin.lobbym.com
      - ./enviroment/admin.env:/var/www/dev.admin.lobbym.com/.env
    environment:
      - HOME=/tmp
    networks:
      - lobbym-network

  lobbym-report-php:
    build:
      context: /var/www/dev.report.lobbym.com
      dockerfile: deployments/Dockerfile
    container_name: lobbym-report-php
    restart: always
    working_dir: /var/www/dev.report.lobbym.com
    volumes:
      - /var/www/dev.report.lobbym.com:/var/www/dev.report.lobbym.com
      - ./enviroment/report.env:/var/www/dev.report.lobbym.com/.env
    environment:
      - HOME=/tmp
    networks:
      - lobbym-network

volumes:
  pg_data:
  es_data:
  cassandra_data:
  rabbitmq_data:

networks:
  lobbym-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
