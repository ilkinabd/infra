version: '3.8'

services:
  # --- MAIN REVERSE PROXY ---
  nginx:
    image: nginx:alpine
    container_name: lobbym-nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../dev.api.lobbym.com:/var/www/dev.api.lobbym.com:ro
      - ../../dev.admin.lobbym.com:/var/www/dev.admin.lobbym.com:ro
      - ../../dev.report.lobbym.com:/var/www/dev.report.lobbym.com:ro
    networks:
      lobbym-network:
        aliases:
          - devlobbym.com
          - devapi.lobbym.com
          - devadmin.lobbym.com
          - devreport.lobbym.com
    depends_on:
      - lobbym-api-php
      - lobbym-admin-php
      - lobbym-report-php

  # --- DATABASES & QUEUES ---
  db:
    image: postgres:17-alpine
    container_name: lobbym-postgres
    restart: always
    environment:
      POSTGRES_DB: lobbym
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - lobbym_pg_data:/var/lib/postgresql/data
      - ../tmp:/tmp
    networks:
      - lobbym-network

  redis:
    image: redis:7-alpine
    container_name: lobbym-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - lobbym-network

  lobbym-socket:
    build:
      context: ../../dev.api.lobbym.com/socket
      dockerfile: Dockerfile
    container_name: lobbym-socket
    ports:
      - "3002:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@lobbym-postgres:5432/lobbym
      - JWT_SECRET=hCn5nyx49PHVeSbN1Aajzh5XUHNOj6xZ5CCupG3Pgl4xzNlv3sirodDRF6N2EnCY
      - PORT=3000
    networks:
      - lobbym-network

  lobbym-scraper:
    build:
      context: ../../dev.api.lobbym.com/scraper
      dockerfile: Dockerfile
    container_name: lobbym-scraper
    shm_size: '2gb'
    ports:
      - "8085:8085"
    networks:
      - lobbym-network
    environment:
      - SCRAPER_PROXY=gkxoynov-tr-rotate:zb2lsvs6o9uv@p.webshare.io:80
      - PYTHONUNBUFFERED=1

  elasticsearch:
    image: elasticsearch:8.11.1
    container_name: lobbym-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - lobbym_es_data:/usr/share/elasticsearch/data
    networks:
      - lobbym-network

  kibana:
    image: kibana:8.11.1
    container_name: lobbym-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://lobbym-elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - lobbym-network

  cassandra:
    image: cassandra:5.0
    container_name: lobbym-cassandra
    mem_limit: 1536m
    ports:
      - "9042:9042"
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=100M
    volumes:
      - lobbym_cassandra_data:/var/lib/cassandra
    networks:
      - lobbym-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: lobbym-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - lobbym_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - lobbym-network

  ffmpeg:
    image: alpine:3.18
    container_name: lobbym-ffmpeg
    restart: always
    volumes:
      - ../../dev.api.lobbym.com/storage:/var/www/dev.api.lobbym.com/storage
    entrypoint: ["sh", "-c", "apk add --no-cache ffmpeg && tail -f /dev/null"]
    networks:
      - lobbym-network

  # --- APPLICATIONS ---


  lobbym-api-php:
    build:
      context: ../../dev.api.lobbym.com
      dockerfile: deployments/Dockerfile
    container_name: lobbym-api-php
    entrypoint: ["sh", "-c", "chmod 666 /var/run/docker.sock && docker-php-entrypoint php-fpm"]
    restart: always
    working_dir: /var/www/dev.api.lobbym.com
    volumes:
      - ../../dev.api.lobbym.com:/var/www/dev.api.lobbym.com
      - ../../dev.api.lobbym.com/deployments/.env:/var/www/dev.api.lobbym.com/.env
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - ../../dev.api.lobbym.com/deployments/.env
    environment:
      - HOME=/tmp
    networks:
      - lobbym-network

  lobbym-email-consumer:
    image: local-lobbym-api-php
    container_name: lobbym-email-consumer
    restart: always
    working_dir: /var/www/dev.api.lobbym.com
    volumes:
      - ../../dev.api.lobbym.com:/var/www/dev.api.lobbym.com
      - ../../dev.api.lobbym.com/deployments/.env:/var/www/dev.api.lobbym.com/.env
    env_file:
      - ../../dev.api.lobbym.com/deployments/.env
    environment:
      - HOME=/tmp
    networks:
      - lobbym-network
    command: php artisan emails:consume
    depends_on:
      - rabbitmq
      - db

  lobbym-notification-consumer:
    image: local-lobbym-api-php
    container_name: lobbym-notification-consumer
    restart: always
    working_dir: /var/www/dev.api.lobbym.com
    volumes:
      - ../../dev.api.lobbym.com:/var/www/dev.api.lobbym.com
      - ../../dev.api.lobbym.com/deployments/.env:/var/www/dev.api.lobbym.com/.env
    env_file:
      - ../../dev.api.lobbym.com/deployments/.env
    environment:
      - HOME=/tmp
    networks:
      - lobbym-network
    command: php artisan notifications:consume
    depends_on:
      - rabbitmq
      - db

  lobbym-admin-php:
    build:
      context: ../../dev.admin.lobbym.com
      dockerfile: deployments/Dockerfile
    container_name: lobbym-admin-php
    restart: always
    working_dir: /var/www/dev.admin.lobbym.com
    volumes:
      - ../../dev.admin.lobbym.com:/var/www/dev.admin.lobbym.com
      - ../../dev.admin.lobbym.com/deployments/.env:/var/www/dev.admin.lobbym.com/.env
    env_file:
      - ../../dev.admin.lobbym.com/deployments/.env
    environment:
      - HOME=/tmp
    networks:
      - lobbym-network

  lobbym-report-php:
    build:
      context: ../../dev.report.lobbym.com
      dockerfile: deployments/Dockerfile
    container_name: lobbym-report-php
    restart: always
    working_dir: /var/www/dev.report.lobbym.com
    volumes:
      - ../../dev.report.lobbym.com:/var/www/dev.report.lobbym.com
      - ../../dev.report.lobbym.com/deployments/.env:/var/www/dev.report.lobbym.com/.env
    env_file:
      - ../../dev.report.lobbym.com/deployments/.env
    environment:
      - HOME=/tmp
    networks:
      - lobbym-network

volumes:
  lobbym_pg_data:
  lobbym_es_data:
  lobbym_cassandra_data:
  lobbym_rabbitmq_data:

networks:
  lobbym-network:
    external: true
