version: '3.8'

services:
  front:
    image: ghcr.io/mailu/nginx:2.0
    restart: always
    env_file: mailu.env
    dns:
      - 172.22.0.254
    ports:
      - "80:80"
      - "443:443"
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
    volumes:
      - ./config:/config
      - ./data:/data
      - ./certs:/certs
    networks:
      - lobbym-network

  resolver:
    image: ghcr.io/mailu/unbound:2.0
    restart: always
    env_file: mailu.env
    networks:
      lobbym-network:
        ipv4_address: 172.22.0.254

  admin:
    image: ghcr.io/mailu/admin:2.0
    restart: always
    env_file: mailu.env
    dns:
      - 172.22.0.254
    volumes:
      - ./data:/data
      - ./dkim:/dkim
    networks:
      - lobbym-network

  imap:
    image: ghcr.io/mailu/dovecot:2.0
    restart: always
    env_file: mailu.env
    dns:
      - 172.22.0.254
    volumes:
      - ./data:/data
      - ./mail:/mail
      - ./overrides:/overrides
      - ./certs:/certs
    networks:
      - lobbym-network

  smtp:
    image: ghcr.io/mailu/postfix:2.0
    restart: always
    env_file: mailu.env
    dns:
      - 172.22.0.254
    volumes:
      - ./data:/data
      - ./overrides:/overrides
      - ./certs:/certs
    networks:
      - lobbym-network

  antispam:
    image: ghcr.io/mailu/rspamd:2.0
    restart: always
    env_file: mailu.env
    dns:
      - 172.22.0.254
    volumes:
      - ./filter:/var/lib/rspamd
    networks:
      - lobbym-network

  webmail:
    image: ghcr.io/mailu/webmail:2.0
    restart: always
    env_file: mailu.env
    dns:
      - 172.22.0.254
    volumes:
      - ./webmail:/data
    networks:
      - lobbym-network

networks:
  lobbym-network:
    external: true
